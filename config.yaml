# -----------------------------------------------------------------------------
# 3. INTENT CONSTRAINTS  (I : S → 2^A in the ICMDP tuple)
# -----------------------------------------------------------------------------
# Each constraint has:
#   type:                 "hard"  — zero-violation, never relaxed (paper Eq. 10/25)
#                         "soft"  — relaxable, subject to relaxation_priority order
#   relaxation_priority:  0       = never relax (hard constraints always use 0)
#                         1..N    = soft constraints; lower number → dropped first
#   keywords:             instruction keywords that activate this constraint
#   always_active:        true → enforce regardless of instruction keywords
# -----------------------------------------------------------------------------
intent_constraints:

  definitions:

    # --- Soft constraints (relaxable, lowest priority dropped first) ----------

    eco_constraint:
      type: soft
      relaxation_priority: 1
      always_active: false
      description: "Vendor must be carbon-neutral / eco-certified"
      keywords: ["carbon-neutral", "carbon neutral", "eco-friendly", "eco friendly",
                 "green", "sustainable", "climate"]

    budget_constraint:
      type: soft
      relaxation_priority: 2
      always_active: false
      description: "Transaction price must not exceed the user's stated budget"
      keywords: ["max", "under", "no more than", "budget", "spend", "spending", "cost", "price"]

    latency_constraint:
      type: soft
      relaxation_priority: 3
      always_active: false
      description: "Transaction must complete within the allowed time window (paper §6.3)"
      keywords: ["within", "second", "seconds", "minute", "minutes", "fast", "quick", "urgent"]
      default_max_seconds: 60.0   # overridden if a numeric value is found in the instruction

    reputation_constraint:
      type: soft
      relaxation_priority: 4
      always_active: false
      description: "Vendor reputation score must meet the minimum threshold"
      keywords: ["trusted", "reliable", "reputable", "verified", "high-rated"]
      default_min_reputation: 0.7

    delivery_sla_constraint:
      type: soft
      relaxation_priority: 5
      always_active: false
      description: "Vendor delivery SLA must be within the stated limit"
      keywords: ["deliver", "delivery", "shipping", "sla", "days", "lead time"]
      default_max_days: 5

    # --- Hard constraints (zero-violation, never relaxed) --------------------

    inventory_constraint:
      type: hard
      relaxation_priority: 0
      always_active: true
      description: "Vendor must have inventory available before accepting or paying"

    vendor_trust_constraint:
      type: hard
      relaxation_priority: 0
      always_active: false
      description: "Vendor must be in the trusted tier (Proposition 4.1 example: 'never transact with unverified seller')"
      keywords: ["trusted vendor", "verified vendor", "certified vendor", "authorised vendor"]

    compliance_constraint:
      type: hard
      relaxation_priority: 0
      always_active: true
      description: "Vendor must meet the required compliance status"
      required_status: "iso20022_compliant"

    payment_rail_constraint:
      type: hard
      relaxation_priority: 0
      always_active: true
      description: "Payment rail must be in the allowed_payment_rails list (enforced structurally)"

    geo_restriction_constraint:
      type: hard
      relaxation_priority: 0
      always_active: true
      description: "Vendor must be in an allowed geographic region"
      allowed_regions: ["US", "EU", "UK", "CA", "AU", "SG", "JP"]

  parser:
    backend: llm_anthropic      # {regex, llm_anthropic, llm_openai, llm_local}
    confidence_threshold: 0.75  # minimum LLM confidence to activate a parsed constraint
    ambiguity_resolution: most_conservative   # {ask_user, most_likely, most_conservative}
    re_parse_on_state_change: false

# -----------------------------------------------------------------------------
# 5. SECRET MANAGEMENT
# -----------------------------------------------------------------------------
secret_management:
  provider: keyring             # {env, keyring, aws, azure, atlassian}
  key_name: CLAUDE_API_KEY      # name of the secret/key to fetch
  keyring_service: icmdp-agent  # used if provider = keyring
  aws_region: us-east-1         # used if provider = aws
  azure_vault_url: ""           # used if provider = azure


# -----------------------------------------------------------------------------
# 4. POLICIES  (π : S → Δ(A))
# -----------------------------------------------------------------------------
policies:

  solver:
    type: masked_q_learning   # {masked_q_learning, value_iteration, policy_gradient}
    # Masked Q-learning hyperparameters (paper §4.6.3, Eq. 20)
    alpha: 0.2                # learning rate ∈ (0, 1]
    gamma: 0.9                # discount factor ∈ [0, 1)
    epsilon: 0.3              # initial exploration rate (ε-greedy)
    epsilon_decay: 0.995      # multiplicative decay applied after each episode
    epsilon_min: 0.05         # floor on exploration rate
    # Training loop settings
    training_episodes: 500
    max_steps_per_episode: 10
    convergence_threshold: 0.001   # used by value_iteration solver type

  feasibility:
    # Maximum number of soft constraints that may be progressively dropped
    # before the system declares the state infeasible (paper §4.3)
    max_relaxations: 2
    # Response when A_I(s) = ∅ and relaxation budget is exhausted
    infeasibility_response: relax    # {relax, abort, escalate_human, notify_user}
    relaxation_cooldown_steps: 0     # steps to wait between successive relaxations

  dynamic_intent:
    # Governs non-stationary intent I_t(s) ≠ I_{t'}(s) (paper §4.5)
    update_trigger: on_infeasibility   # {never, on_infeasibility, on_market_change, periodic}
    update_interval_steps: 10          # used when update_trigger = periodic
    constraint_injection_mode: full_reparse   # {full_reparse, incremental_update}

  negotiation:
    initial_bid_strategy: ask_price   # {ask_price, ask_minus_discount, midpoint, conservative}
    bid_increment: 25.0               # price step size for counter-bidding
    max_negotiation_rounds: 5         # rounds per vendor before forced accept/reject
    vendor_selection_strategy: greedy_q   # {greedy_q, round_robin, best_reputation, random}
    multi_vendor_mode: sequential         # {sequential, parallel_query_then_decide, best_of_n}

  belief_update:
    # Controls the POMDP belief updater (paper §3.2, Eq. 6)
    mode: argmax                  # {argmax, full_distribution, particle_filter}
    observation_noise_model: perfect   # {perfect, gaussian, categorical}


# -----------------------------------------------------------------------------
# 5. STOCHASTIC PROBABILITIES  (P and Z in the ICMDP tuple)
# -----------------------------------------------------------------------------
probabilities:

  # P(s' | s, a) — state transition model
  state_transitions:
    price_drift_prob: 0.1              # P(price changes on any non-terminal step)
    price_drift_direction: symmetric   # {up_only, down_only, symmetric}
    price_drift_magnitude: 50.0        # magnitude used for directional drift (not symmetric)
    inventory_depletion_prob: 0.05     # P(inv 1→0 | non-terminal step)
    inventory_restock_prob: 0.02       # P(inv 0→1 | non-terminal step)
    eco_cert_revocation_prob: 0.01     # P(eco 1→0 | non-terminal step)
    reputation_decay_rate: 0.005       # std dev of Gaussian noise on rep per step

  # Z(o | s', a) — observation model for the POMDP perception layer (paper §3.2)
  # Set query_reveals_true_state: true for the argmax / perfect simplification.
  # Set to false and tune noise parameters for noisy-observation experiments.
  observation_model:
    query_reveals_true_state: true      # if true, all noise parameters below are bypassed
    price_observation_accuracy: 1.0     # P(observed price = true price)
    inventory_signal_accuracy: 0.95     # P(correct inventory signal)
    eco_cert_false_positive_rate: 0.02  # P(observe eco=1 | true eco=0)
    eco_cert_false_negative_rate: 0.01  # P(observe eco=0 | true eco=1)
    reputation_observation_variance: 0.05  # Gaussian noise std dev on reputation score

  # Market-level stochastic parameters
  market_model:
    vendor_acceptance_margin: 0.0      # vendor accepts bid if bid >= ask + margin
    stockout_prob_per_step: 0.05       # P(vendor sells out to another buyer per step)
    price_drop_prob_per_step: 0.03     # P(vendor lowers ask price per step)
    bid_counter_offer_prob: 0.2        # P(vendor counters rather than accept/reject)

  # Intent parsing likelihoods (used when backend = llm_*)
  intent_parsing:
    constraint_type_priors:
      eco_constraint: 0.30
      budget_constraint: 0.80
      latency_constraint: 0.20
      vendor_trust_constraint: 0.40
      compliance_constraint: 0.30
      reputation_constraint: 0.25
    parse_error_rate: 0.05         # P(LLM misinterprets a constraint)
    over_specification_prob: 0.10  # P(extracted constraints make A_I(s)=∅ at parse time)


# -----------------------------------------------------------------------------
# 6. REWARD FUNCTION  (R : S × A → ℝ)
# -----------------------------------------------------------------------------
rewards:
  query_step_penalty: -1.0           # cost of a standard Query step
  deep_query_step_penalty: -2.0      # higher cost for DeepQuery (more information)
  successful_bid_reward: 10.0        # bid accepted (price >= ask)
  failed_bid_penalty: -5.0           # bid rejected (price < ask)
  accept_reward: 5.0                 # accepting the vendor's current ask
  reject_reward: 0.0                 # rejecting (neutral — ends interaction)
  successful_pay_reward: 100.0       # transaction completed successfully
  failed_pay_penalty: -50.0          # payment failed (out of stock or underpaid)
  latency_penalty_per_second: -0.1   # per-second penalty; set to 0.0 to disable
  escalate_penalty: -10.0            # cost of escalating to human (§4.3 meta-decision)
  constraint_violation_penalty: -1000.0  # should be unreachable in ICMDP (zero-violation)
