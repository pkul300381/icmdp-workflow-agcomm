# =============================================================================
# ICMDP Agentic Commerce — Master Configuration
# All runtime behavior is driven by this file. No code changes are needed to
# adjust states, actions, constraints, policies, or probabilities.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. STATE SPACE  (S in the ICMDP tuple)
# -----------------------------------------------------------------------------
state_space:

  vendor_state:
    # Discrete ask-price bins (p_ask ∈ S). Paper §6.2 discretises the
    # naturally continuous price to satisfy the finite-state MDP assumption.
    p_ask_levels: [100.0, 150.0, 200.0, 500.0]

    # Inventory sampling weights. [0] appears once; [1] appears inv_high_prob_weight times.
    # Higher weight → higher probability the vendor has stock at episode start.
    inv_high_prob_weight: 3          # results in P(inv=1) = 0.75

    # Carbon-neutral / eco-certification options (0 = not certified, 1 = certified)
    eco_options: [0, 1]

    # Vendor reputation score drawn uniformly from [min, max]
    reputation_range: [0.5, 1.0]

    # Metadata fields — used by hard constraints; extend State when needed
    default_vendor_tier: "trusted"            # {trusted, untrusted, blacklisted}
    default_compliance: "iso20022_compliant"  # {iso20022_compliant, partial, non_compliant}
    default_latency_ms: 200.0
    default_delivery_sla_days: 3
    default_payment_terms: "net_30"           # {net_30, net_60, immediate, escrow}
    default_geo_region: "US"
    default_currency: "USD"

  session_state:
    # Per-episode session tracking (feeds latency and budget constraints)
    initial_budget: 200.0            # user's total spend budget for the session
    max_t_elapsed_seconds: 60.0      # default latency cap (paper §6.3: t_elapsed ≤ 60s)
    step_duration_seconds: 1.0       # simulated wall-clock seconds consumed per agent step
    max_items_to_purchase: 1

  # Initial belief prior for BeliefTracker before any observations
  belief_prior:
    p_ask: 200.0
    inv: 1
    eco: 1     # optimistic: assume eco-certified until observed otherwise
    rep: 0.8


# -----------------------------------------------------------------------------
# 2. ACTION SPACE  (A in the ICMDP tuple)
# -----------------------------------------------------------------------------
action_space:

  # Toggle individual action types on/off without touching Python.
  # Removing a type here prunes it from A globally.
  enabled_action_types:
    - Query               # observe public vendor info (low cost)
    - DeepQuery           # observe private/hidden vendor info (higher cost)
    - Bid                 # submit a price offer
    - CounterBid          # counter-offer in multi-round negotiation
    - Accept              # accept the current ask price
    - Reject              # reject and end negotiation with this vendor
    - Pay                 # execute settlement
    - RequestDiscount     # ask for volume discount
    - VerifyCompliance    # trigger regulatory compliance check
    - RequestCertification  # request eco/compliance certificate
    - SwitchVendor        # pivot to an alternative vendor
    - EscalateToHuman     # meta-action: hand off to human (paper §4.3)
    - Abandon             # abort entire transaction

  # Discrete price levels for Bid, CounterBid, RequestDiscount, Pay actions.
  # Should align with or be a subset of state_space.vendor_state.p_ask_levels.
  bid_price_levels: [100.0, 150.0, 200.0, 500.0]

  # Payment rail used for all Pay actions during training and execution.
  # Change this to switch the settlement channel without any code change.
  default_payment_rail: ISO_20022

  # Subset of rails enabled for this deployment (used for payment_rail_constraint).
